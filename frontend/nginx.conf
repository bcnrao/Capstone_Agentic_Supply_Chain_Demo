server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI service on the compose network. The browser
    # uses same-origin /api/* so the bundle works from any host (LAN, cloud) without
    # baking in localhost or a public IP at build time.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Single-page app: unknown routes fall back to index.html so client-side
    # routing works on refresh/deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
