[project]
name = "agentic-scd"
version = "0.1.0"
description = "Agentic Supply Chain Disruption Predictor & Simulation Engine (capstone POC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "groq>=0.11",
    "psycopg[binary]>=3.3.4",
]

[project.scripts]
agentic-scd = "agentic_scd.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_scd"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
# Auxiliary doc-generation scripts are not part of the package and are not
# held to the project lint/format bar.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files re-export their public API; the imports are
# intentional even though they are not used within the file itself.
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
